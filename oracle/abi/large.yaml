  - id: calls.interrupt_named_register_bank
    status: verified
    claim: A TASKING _interrupt function qualified with _using(NAME) stores the entry R0 in the named memory-mapped register bank, switches CP through SCXT before generated GPR use, and restores CP before RETI; a calling handler additionally preserves MDC, DPP0, DPP2, MDH and MDL on the system stack without pushing the old GPR bank.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: "3.12 Interrupt Functions, Register Banks: _using()"
          pages: 3-77--3-78
      tasking:
        case: named_register_bank
        functions:
          - name: named_bank_registers
            checks:
              - kind: sequence
                instructions:
                  - {opcode: MOV, operands: ["DPP3:FAST_BANK", R0]}
                  - {opcode: SCXT, operands: [CP, "#DPP3:FAST_BANK"]}
                  - {opcode: NOP}
                  - {opcode: POP, operands: [CP]}
                  - {opcode: RETI}
          - name: named_bank_call
            checks:
              - kind: sequence
                instructions:
                  - {opcode: MOV, operands: ["DPP3:CALL_BANK", R0]}
                  - {opcode: SCXT, operands: [CP, "#DPP3:CALL_BANK"]}
                  - {opcode: SCXT, operands: [MDC, "#16"]}
                  - {opcode: PUSH, operands: [DPP0]}
                  - {opcode: PUSH, operands: [DPP2]}
                  - {opcode: PUSH, operands: [MDH]}
                  - {opcode: PUSH, operands: [MDL]}
                  - {opcode: CALLS, operands: ["SEG _named_bank_callee", _named_bank_callee]}
                  - {opcode: POP, operands: [MDL]}
                  - {opcode: POP, operands: [MDH]}
                  - {opcode: POP, operands: [DPP2]}
                  - {opcode: POP, operands: [DPP0]}
                  - {opcode: POP, operands: [MDC]}
                  - {opcode: POP, operands: [CP]}
                  - {opcode: RETI}
      llvm:
