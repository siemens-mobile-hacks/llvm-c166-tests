  - id: args.stackparm
    status: verified
    claim: The TASKING _stackparm qualifier passes every argument on the user stack at increasing offsets from R0; callers remove the complete argument area, while return registers, CALLS/RETS and indirect-call function-pointer handling remain the ordinary Classic Large convention.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-64
      tasking:
        case: stackparm
        functions:
          - name: stackparm_callee
            checks:
              - {kind: contains, instruction: {opcode: MOVB, operands: [RL1, "[R0]"]}}
              - {kind: contains, instruction: {opcode: MOV, operands: [R12, "[R0+#2]"]}}
              - {kind: contains, instruction: {opcode: MOV, operands: [R13, "[R0+#4]"]}}
              - {kind: contains, instruction: {opcode: MOV, operands: [R14, "[R0+#8]"]}}
              - {kind: contains, instruction: {opcode: RETS}}
          - name: stackparm_caller
            checks:
              - {kind: contains, instruction: {opcode: MOV, operands: ["[-R0]", R15]}}
              - {kind: contains, instruction: {opcode: MOV, operands: ["[-R0]", R14]}}
              - {kind: sequence, instructions: [{opcode: CALLS, operands: [SEG _stackparm_external, _stackparm_external]}, {opcode: ADD, operands: [R0, "#10"]}, {opcode: RETS}]}
          - name: stackparm_indirect
            checks:
              - {kind: sequence, instructions: [{opcode: MOV, operands: [R4, R12]}, {opcode: MOV, operands: [R5, R13]}, {opcode: CALLS, operands: [SEG __icall, __icall]}, {opcode: ADD, operands: [R0, "#10"]}, {opcode: RETS}]}
          - name: stackparm_far_caller
            checks:
              - {kind: sequence, instructions: [{opcode: CALLS, operands: [SEG _stackparm_external_far, _stackparm_external_far]}, {opcode: ADD, operands: [R0, "#6"]}, {opcode: RETS}]}
          - name: stackparm_float_caller
            checks:
              - {kind: sequence, instructions: [{opcode: CALLS, operands: [SEG _stackparm_external_float, _stackparm_external_float]}, {opcode: ADD, operands: [R0, "#6"]}, {opcode: RETS}]}
          - name: stackparm_aggregate_caller
            checks:
