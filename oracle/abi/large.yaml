schema_version: 1
toolchain: TASKING Classic C166/ST10 8.6r1
model: large
status: checked_baseline

authority:
  c_abi: TASKING Classic 8.6 manual and compiler assembly oracle
  firmware_crosscheck: Ghidra instruction listing only
  vx_elf_pdf: reference_only_not_abi_authority

facts:
  - id: calls.direct_far
    status: verified
    claim: Large-model direct C calls use CALLS and ordinary functions use RETS.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.2.1.4 Large Memory Model
          pages: 3-15
      tasking: {case: abi_core, function: abi_call_five_words}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - {kind: proc_kind, value: FAR}
      - kind: sequence
        instructions:
          - {opcode: CALLS, operands: [SEG _abi_external_five_words, _abi_external_five_words]}
          - {opcode: RETS}

  - id: args.first_four_words
    status: verified
    claim: The first four word-sized arguments occupy R12, R13, R14 and R15.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-63
      tasking: {case: abi_core, function: abi_four_words}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: ADD, operands: [R4, R13]}
          - {opcode: ADD, operands: [R4, R14]}
          - {opcode: ADD, operands: [R4, R15]}

  - id: args.packed_two_word
    status: verified
    claim: A two-word scalar can start at R13; register pairs are packed, not even-aligned.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-63, 3-64
      tasking: {case: abi_core, function: abi_pair_then_words}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: MOV, operands: [R5, R13]}
          - {opcode: ADD, operands: [R4, R14]}
          - {opcode: ADD, operands: [R4, R15]}
          - {opcode: MOV, operands: [R14, "[R0]"]}

  - id: types.long_long_alias
    status: verified
    claim: TASKING Classic accepts long long as a 32-bit, word-aligned alias of long; it uses the ordinary packed two-word argument, aggregate layout and R4:R5 return ABI rather than an i64 ABI.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.4 Data Types, table 3-12
          pages: 3-53, 3-54
        - document: ST10 C Cross-Compiler User's Manual
          section: Compiler diagnostic W72 duplicate type modifier
          pages: 5-14
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-63, 3-64
      tasking:
        case: long_long_alias
        functions:
          - name: sizeof_long_long
            checks:
              - {kind: sequence, instructions: [{opcode: MOV, operands: [R4, "#4"]}, {opcode: RETS}]}
          - name: sizeof_long_long_record
            checks:
              - {kind: sequence, instructions: [{opcode: MOV, operands: [R4, "#6"]}, {opcode: RETS}]}
          - name: add_long_long
            checks:
              - kind: sequence
                instructions:
                  - {opcode: MOV, operands: [R4, R12]}
                  - {opcode: MOV, operands: [R5, R13]}
                  - {opcode: ADD, operands: [R4, R14]}
                  - {opcode: ADDC, operands: [R5, R15]}
                  - {opcode: RETS}
          - name: packed_long_long
            checks:
              - kind: sequence
                instructions:
                  - {opcode: MOV, operands: [R4, R13]}
                  - {opcode: MOV, operands: [R5, R14]}
                  - {opcode: ADD, operands: [R4, R12]}
                  - {opcode: ADDC, operands: [R5, R13]}
                  - {opcode: ADD, operands: [R4, R15]}
                  - {opcode: ADDC, operands: [R5, R12]}
                  - {opcode: RETS}
      llvm:
        - clang/test/CodeGen/C166/long-long.c

  - id: args.stack_stop
    status: verified
    claim: Once one argument does not fit in R12-R15, it and all following arguments use the user stack.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-64
      tasking: {case: abi_core, function: abi_stack_stop}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: ADD, operands: [R4, R13]}
          - {opcode: ADD, operands: [R4, R15]}
          - {opcode: MOV, operands: [R12, "[R0]"]}

  - id: args.stack_word_order
    status: verified
    claim: Consecutive stack words are stored at increasing offsets from R0.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-64
      tasking: {case: abi_core, function: abi_two_stack_words}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, "[R0]"]}
          - {opcode: MOV, operands: [R12, "[R0+#2]"]}

  - id: calls.fifth_word_cleanup
    status: verified
    claim: A fifth word is pushed by the caller and the caller removes two bytes after CALLS.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-63, 3-64
      tasking: {case: abi_core, function: abi_call_five_words}
      llvm:
        - clang/test/CodeGen/C166/mvp.c
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R1, "[R0]"]}
          - {opcode: MOV, operands: ["[-R0]", R1]}
          - {opcode: CALLS, operands: [SEG _abi_external_five_words, _abi_external_five_words]}
          - {opcode: ADD, operands: [R0, "#2"]}
          - {opcode: RETS}

  - id: calls.stack_stop_push_order
    status: verified
    claim: A stack-forced long is pushed high then low, later arguments first, and the caller removes six bytes.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-64
      tasking: {case: abi_core, function: abi_call_stack_stop}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R15, "[R0+#4]"]}
          - {opcode: MOV, operands: ["[-R0]", R15]}
          - {opcode: MOV, operands: [R1, "[R0+#2]"]}
          - {opcode: MOV, operands: [R2, "[R0+#4]"]}
          - {opcode: MOV, operands: ["[-R0]", R2]}
          - {opcode: MOV, operands: ["[-R0]", R1]}
          - {opcode: CALLS, operands: [SEG _abi_external_stack_stop, _abi_external_stack_stop]}
          - {opcode: ADD, operands: [R0, "#6"]}

  - id: returns.byte
    status: verified
    claim: A character result is returned through the R4 register byte lane.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-15
          pages: 3-87
      tasking: {case: abi_core, function: abi_ret_u8}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: RETS}

  - id: returns.word
    status: verified
    claim: A short or int result is returned in R4.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-15
          pages: 3-87
      tasking: {case: abi_core, function: abi_ret_u16}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: RETS}

  - id: returns.long_word_order
    status: verified
    claim: A long result uses R4 for its low word and R5 for its high word.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-15
          pages: 3-87
      tasking: {case: abi_core, function: abi_ret_u32}
      llvm:
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: MOV, operands: [R5, R13]}
          - {opcode: RETS}

  - id: pointers.far_argument_words
    status: verified
    claim: A default Large data pointer uses page offset in the low word and page number in the high word.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.4 Data Types, table 3-12
          pages: 3-53
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-15
          pages: 3-87
      tasking: {case: abi_core, function: abi_load_far}
      llvm:
        - clang/test/CodeGen/C166/mvp.c
        - llvm/test/CodeGen/C166/abi.ll
    checks:
      - kind: sequence
        instructions:
          - {opcode: EXTP, operands: [R13, "#1"]}
          - {opcode: MOV, operands: [R4, "[R12]"]}

  - id: pointers.far_return_words
    status: verified
    claim: A far pointer result uses R4 for page offset and R5 for page number.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-15
          pages: 3-87
      tasking: {case: abi_core, function: abi_ret_far}
      llvm:
        - clang/test/CodeGen/C166/mvp.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: MOV, operands: [R5, R13]}

  - id: pointers.data_pointer_to_long_default
    status: verified
    claim: Default TASKING -OQ converts a far data pointer to long through its huge linear form, (page << 14) | offset.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 4.3.3 Optimize, -O q/Q
          pages: 4-59
      tasking: {case: pointer_casts, function: data_pointer_to_long}
      llvm:
        - clang/test/CodeGen/C166/far-pointer-casts.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R14, R13]}
          - {opcode: SHL, operands: [R14, "#14"]}
          - {opcode: OR, operands: [R12, R14]}
          - {opcode: SHR, operands: [R13, "#2"]}
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: MOV, operands: [R5, R13]}

  - id: pointers.long_to_data_pointer_default
    status: verified
    claim: Default TASKING -OQ converts a long through huge form to far data-pointer page:offset words.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 4.3.3 Optimize, -O q/Q
          pages: 4-59
      tasking: {case: pointer_casts, function: long_to_data_pointer}
      llvm:
        - clang/test/CodeGen/C166/far-pointer-casts.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: MOV, operands: [R5, R13]}
          - {opcode: MOV, operands: ["[-R0]", R4]}
          - {opcode: SHR, operands: [R4, "#14"]}
          - {opcode: SHL, operands: [R5, "#2"]}
          - {opcode: OR, operands: [R5, R4]}
          - {opcode: MOV, operands: [R4, "[R0+]"]}
          - {opcode: AND, operands: [R4, "#16383"]}

  - id: pointers.function_pointer_long_default
    status: verified
    claim: Under default TASKING -OQ, function-pointer casts to and from long preserve the raw segment:offset words.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 4.3.3 Optimize, -O q/Q
          pages: 4-59
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.2 Accessing Memory
          pages: 3-5
      tasking:
        case: pointer_casts
        functions:
          - name: function_pointer_to_long
            checks:
              - kind: sequence
                instructions:
                  - {opcode: MOV, operands: [R4, R12]}
                  - {opcode: MOV, operands: [R5, R13]}
                  - {opcode: RETS}
          - name: long_to_function_pointer
            checks:
              - kind: sequence
                instructions:
                  - {opcode: MOV, operands: [R4, R12]}
                  - {opcode: MOV, operands: [R5, R13]}
                  - {opcode: RETS}
      llvm:
        - clang/test/CodeGen/C166/far-pointer-casts.c

  - id: pointers.default_far_comparison
    status: verified
    claim: All six default TASKING -Of relations compare only the stored 16-bit offset word for two non-null far data pointers.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 4.3.3 Optimize, -O f/F
          pages: 4-13
      tasking:
        case: far_pointer_compare
        functions:
          - name: far_eq
            checks:
              - {kind: contains, instruction: {opcode: CMP, operands: [R12, R14]}}
              - {kind: absent, instruction: {opcode: CMP, operands: [R13, R15]}}
          - name: far_ne
            checks:
              - {kind: contains, instruction: {opcode: CMP, operands: [R12, R14]}}
              - {kind: absent, instruction: {opcode: CMP, operands: [R13, R15]}}
          - name: far_lt
            checks:
              - {kind: contains, instruction: {opcode: CMP, operands: [R12, R14]}}
              - {kind: absent, instruction: {opcode: CMP, operands: [R13, R15]}}
          - name: far_le
            checks:
              - {kind: contains, instruction: {opcode: CMP, operands: [R12, R14]}}
              - {kind: absent, instruction: {opcode: CMP, operands: [R13, R15]}}
          - name: far_gt
            checks:
              - {kind: contains, instruction: {opcode: CMP, operands: [R12, R14]}}
              - {kind: absent, instruction: {opcode: CMP, operands: [R13, R15]}}
          - name: far_ge
            checks:
              - {kind: contains, instruction: {opcode: CMP, operands: [R12, R14]}}
              - {kind: absent, instruction: {opcode: CMP, operands: [R13, R15]}}
      llvm:
        - clang/test/CodeGen/C166/far-pointer.c

  - id: pointers.default_far_difference
    status: verified
    claim: Subtracting two default far pointers subtracts only their 16-bit offsets and scales the signed result by the pointed-to element size.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.2.1.4 Large Memory Model
          pages: 3-15, 3-16
      tasking: {case: far_pointer_compare, function: far_difference}
      llvm:
        - clang/test/CodeGen/C166/far-pointer.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: SUB, operands: [R12, R14]}
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: ASHR, operands: [R4, "#1"]}
      - {kind: absent, instruction: {opcode: SUBC, operands: [R13, R15]}}

  - id: pointers.null_comparison
    status: verified
    claim: Comparing a far data pointer to null considers both stored words.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 4.3.3 Optimize, -O f/F
          pages: 4-13
      tasking: {case: far_pointer_compare, function: far_is_null}
      llvm:
        - clang/test/CodeGen/C166/far-pointer.c
    checks:
      - {kind: contains, instruction: {opcode: OR, operands: [R12, R13]}}

  - id: pointers.function_comparison
    status: verified
    claim: Function-pointer equality compares both segment offset and segment number.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.2 Accessing Memory
          pages: 3-5
      tasking: {case: far_pointer_compare, function: function_eq}
      llvm:
        - clang/test/CodeGen/C166/far-pointer.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: SUB, operands: [R12, R14]}
          - {opcode: SUBC, operands: [R13, R15]}

  - id: pointers.far_arithmetic_width
    status: verified
    claim: Default far-data pointer arithmetic modifies only the page-offset word.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.2.1.4 Large Memory Model
          pages: 3-15, 3-16
      tasking: {case: far_pointer_compare, function: far_subtract}
      llvm:
        - clang/test/CodeGen/C166/far-pointer.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, R12]}
          - {opcode: MOV, operands: [R5, R13]}
          - {opcode: SUB, operands: [R4, R14]}
      - {kind: absent, instruction: {opcode: SUBC, operands: [R5, R15]}}

  - id: calls.indirect_function_pointer
    status: verified
    claim: __icall receives a Large function pointer in R4:R5 while C arguments retain the normal argument convention.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-15
          pages: 3-87
      tasking: {case: indirect_call, function: call_indirect2}
      llvm:
        - clang/test/CodeGen/C166/indirect-call.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R5, R14]}
          - {opcode: MOV, operands: [R4, R1]}
          - {opcode: CALLS, operands: [SEG __icall, __icall]}
          - {opcode: RETS}

  - id: stack.fixed_frame
    status: verified
    claim: R0 is the user-stack pointer and fixed automatic storage is allocated and released by equal byte counts.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-14
          pages: 3-87
        - document: ST10 C Cross-Compiler User's Manual
          section: 7.2 Stack Size
          pages: 7-8
      tasking: {case: frame_core, function: local_word}
      llvm:
        - clang/test/CodeGen/C166/frame.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: SUB, operands: [R0, "#2"]}
          - {opcode: MOV, operands: ["[R0]", R12]}
          - {opcode: MOV, operands: [R4, "[R0]"]}
          - {opcode: ADD, operands: [R0, "#2"]}
          - {opcode: RETS}

  - id: stack.escaped_address
    status: verified
    claim: An automatic object's default far address is formed as R0 masked to 14 bits plus DPP1.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.2.1.7 Efficiency in Large Data Models
          pages: 3-20, 3-21
        - document: ST10 C Cross-Compiler User's Manual
          section: 7.2 Stack Size
          pages: 7-8
      tasking: {case: stack_address, function: pass_local_address}
      llvm:
        - clang/test/CodeGen/C166/stack-address.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R12, R0]}
          - {opcode: AND, operands: [R12, "#16383"]}
          - {opcode: MOV, operands: [R13, DPP1]}

  - id: stack.fixed_offset_256
    status: verified
    claim: A constant in-page automatic offset uses direct R0-relative addressing without EXTP.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6.1 Static Approach of Function Automatics
          pages: 3-64, 3-65
      tasking: {case: stack_address, function: access_stack_offset_256}
      llvm:
        - clang/test/CodeGen/C166/stack-address.c
        - clang/test/CodeGen/C166/frame.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: ["[R0+#256]", R12]}
          - {opcode: MOV, operands: [R4, "[R0+#256]"]}
      - {kind: count, instruction: {opcode: EXTP}, equals: 0}

  - id: aggregates.argument_stack
    status: verified
    claim: A structure passed by value is placed on the user stack.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-64
      tasking: {case: aggregate_abi, function: take_two}
      llvm:
        - clang/test/CodeGen/C166/aggregate.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R4, "[R0]"]}
          - {opcode: MOV, operands: [R12, "[R0+#2]"]}

  - id: aggregates.argument_stop_rule
    status: verified
    claim: A by-value aggregate activates the stack-stop rule for every following argument.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-64
      tasking: {case: aggregate_abi, function: mixed_aggregate}
      llvm:
        - clang/test/CodeGen/C166/aggregate.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: [R13, "[R0]"]}
          - {opcode: MOV, operands: [R12, "[R0+#2]"]}
          - {opcode: MOV, operands: [R14, "[R0+#4]"]}

  - id: aggregates.caller_reserved_result
    status: verified
    claim: A structure result is written to caller-reserved user-stack storage and R4 returns its address.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-15
          pages: 3-87
      tasking: {case: aggregate_abi, function: return_two}
      llvm:
        - clang/test/CodeGen/C166/aggregate.c
    checks:
      - kind: sequence
        instructions:
          - {opcode: MOV, operands: ["[R0+#4]", R12]}
          - {opcode: MOV, operands: ["[R0+#6]", R13]}
          - {opcode: MOV, operands: [R4, "#4"]}
          - {opcode: ADD, operands: [R4, R0]}

  - id: aggregates.result_with_stack_tail
    status: verified
    claim: An eight-byte caller-reserved aggregate result coexists with an eight-byte stack-argument tail; the arguments are removed after CALLS before the result block is consumed.
    provenance:
      pdf:
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.6 Function Parameters
          pages: 3-63, 3-64
        - document: ST10 C Cross-Compiler User's Manual
          section: 3.15 Register Usage, table 3-15
          pages: 3-87
      tasking:
        case: aggregate_abi
        functions:
          - name: return_four_with_stack_tail
            checks:
              - kind: sequence
                instructions:
                  - {opcode: SUB, operands: [R0, "#8"]}
                  - {opcode: MOV, operands: [R1, "[R0+#8]"]}
                  - {opcode: MOV, operands: [R2, "[R0+#10]"]}
                  - {opcode: MOV, operands: [R3, "[R0+#12]"]}
                  - {opcode: MOV, operands: [R4, "[R0+#14]"]}
                  - {opcode: CALLS, operands: [SEG __cpnnw, __cpnnw]}
                  - {opcode: MOV, operands: [R4, "#16"]}
                  - {opcode: ADD, operands: [R4, R0]}
                  - {opcode: ADD, operands: [R0, "#8"]}
                  - {opcode: RETS}
          - name: consume_return_four_with_stack_tail
            checks:
              - kind: sequence
                instructions:
